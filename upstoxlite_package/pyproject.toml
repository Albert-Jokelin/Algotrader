[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upstoxlite"
version = "0.2.0"
description = "Near-complete Upstox API wrapper (sync + async) with typed models, retries, rate-limit handling and websocket manager."
authors = [{name = "Albert Jokelin"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.7"

dependencies = [
  "requests>=2.31",
  "aiohttp>=3.8",
  "websocket-client>=1.6",
  "websockets>=11.0",
  "pydantic>=1.10",
  "tenacity>=8.2",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "responses",
  "aioresponses"
]

[tool.setuptools.packages.find]
where = ["."]
